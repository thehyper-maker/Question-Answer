<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>❤️ یه سوال مهم...</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;500;700&display=swap" rel="stylesheet">

</head>

<body>

<div id="hearts"></div>

<div class="glass">

<h3 id="typing"></h3>

<h1 id="question" class="hide">

با من میای دیت؟ ❤️

</h1>

<div id="buttons" class="hide">

<button id="yes">

😍 آره

</button>

<button id="no">

🙈 نه

</button>

</div>

</div>

<div id="step2" class="hide">

<h2>

🥹 خوشحالم قبول کردی...

</h2>

<p>

حالا فقط تاریخ قرارمون رو انتخاب کن.

</p>

<input type="date" id="date">

<input type="time" id="time">

<select id="place">

<option>☕ کافه</option>

<option>🍕 رستوران</option>

<option>🎬 سینما</option>

<option>🌳 پارک</option>

</select>

<textarea

id="message"

placeholder="یه پیام برام بنویس ❤️"

></textarea>

<button id="submit">

ثبت قرار 💌

</button>

</div>

<div id="finish" class="hide">

<h1>

❤️

</h1>

<h2>

قرارمون ثبت شد...

</h2>

<p>

منتظر اون روز میمونم 🥹

</p>

</div>

<script src="script.js"></script>

</body>

</html>
